name: Daily news digest to LinkedIn

on:
  schedule:
    - cron: "0 15 * * *" # 8:00 AM Pacific (7:00 AM in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (true) or really post (false)"
        default: "true"

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post digest
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/post-daily-digest.mjs
      - name: Remember posted papers
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Record papers posted to LinkedIn"
            git push
          fi
